async function loadMadaServerPosts(){
  if(!madaCurrentUser)return;
  const token=++madaFeedLoad;madaLoadMine();
  const {data:posts,error}=await madaSb.from("posts").select("id,author_id,body,created_at,visibility,kind,link_url,poll_options").is("deleted_at",null).eq("visibility","public").order("created_at",{ascending:false}).limit(100);
  if(error){toast(L("تعذر تحميل منشورات الخادم","Could not load server posts"));return}
  const pr0=await madaLoadPromos(posts||[]);const ids=[...new Set(pr0.map(p=>p.author_id))];let profs=[];
  if(ids.length){const q=await madaSb.from("profiles").select("id,username,display_name,verified_badge,pioneer_badge,avatar_url").in("id",ids);if(!q.error)profs=q.data||[]}
  if(token!==madaFeedLoad)return;
  const map=new Map(profs.map(p=>[p.id,p]));madaServerPosts=pr0.map(p=>({...p,profile:map.get(p.author_id)||{display_name:"عضو MADA",username:"member",verified_badge:false}}));
  await madaLoadMeta();if(S.view==="home")renderMadaServerFeed();
}
