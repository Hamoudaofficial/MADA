s.querySelector('[data-ra="share"] b').textContent=L("مشاركة","Share");s.querySelector('[data-ra="repost"] b').textContent=L("نشر","Repost");madaRLPaint(s,r);return s}
function madaRLRender(rows){const R=madaRL,c=R.root.querySelector(".rcap");c&&c.remove();rows.forEach(r=>{const s=madaRLSlide(r);R.sc.appendChild(s);R.io.observe(s)})}
async function madaRLPage(){const R=madaRL;if(R.busy||R.done||!madaCurrentUser)return;R.busy=1;const {data,error}=await madaSb.rpc("reels_page",{p_limit:8,...(R.cur2||{})});R.busy=0;if(!R.root||!R.root.isConnected)return;
if(error){if(!R.items.length){const c=madaRLCache();if(c.length){R.items=c;R.done=1;madaRLRender(c)}else madaRLEmpty(L("تعذر تحميل الفيديوهات","Couldn't load videos"))}return}
const d=data||[];if(d.length<8)R.done=1;if(d.length){const z=d[d.length-1];R.cur2={p_ts:z.created_at,p_id:z.id}}
const rows=d.filter(r=>madaRLOk(r)&&!R.items.some(x=>x.id===r.id));if(!rows.length){if(!R.items.length)madaRLEmpty();else if(!R.done)madaRLPage();return}R.items.push(...rows);madaRLSave();madaRLRender(rows)}
function madaRLStop(){const R=madaRL;document.body.classList.remove("in-reels");R.io&&R.io.disconnect();R.sc&&R.sc.querySelectorAll(".rl").forEach(madaRLDetach);Object.assign(R,{root:null,sc:null,io:null,items:[],idx:-1,busy:0,done:0,cur:null,cur2:null})}
function madaRLHeart(s,x,y){const r=madaRLIt(s);if(r&&!r.liked&&madaCurrentUser)madaRLAction("like",s);snd("heart");const h=document.createElement("div");h.className="rl-hrt";h.style.cssText="left:"+x+"px;top:"+y+"px";h.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="rlhg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9ab4"/><stop offset="1" stop-color="#ff2d55"/></linearGradient></defs><path fill="url(#rlhg)" d="M12 20.500S3.500 15.300 3.500 9.200A4.700 4.700 0 0 1 12 6.800a4.700 4.700 0 0 1 8.500 2.400c0 6.100-8.500 11.300-8.500 11.300z"/></svg>';document.body.appendChild(h);fx(h,"#ff6b8a");try{navigator.vibrate&&navigator.vibrate(18)}catch(e){}setTimeout(()=>h.remove(),950)}
async function madaRLAction(a,s){const R=madaRL,r=madaRLIt(s);if(!r||!madaCurrentUser)return;const uid=madaCurrentUser.id;
if(a==="like"){const on=!r.liked;r.liked=on;r.like_count=Math.max(0,(r.like_count|0)+(on?1:-1));madaRLPaint(s,r);const {error}=await(on?madaSb.from("post_reactions").insert({post_id:r.post_id,user_id:uid}):madaSb.from("post_reactions").delete().eq("post_id",r.post_id).eq("user_id",uid));if(error){r.liked=!on;r.like_count=Math.max(0,r.like_count+(on?-1:1));madaRLPaint(s,r);toast(L("تعذر تنفيذ الإجراء","Action failed"))}madaRLSave()}
else if(a==="follow"){if(!r.author_id||r.author_id===uid)return;const on=!r.followed,set=v=>{R.items.forEach(x=>{if(x.author_id===r.author_id)x.followed=v});R.sc.querySelectorAll(".rl").forEach(e=>{const x=madaRLIt(e);if(x&&x.author_id===r.author_id)madaRLPaint(e,x)})};set(on);const {error}=await(on?madaSb.from("follows").insert({follower_id:uid,followed_id:r.author_id}):madaSb.from("follows").delete().eq("follower_id",uid).eq("followed_id",r.author_id));if(error){set(!on);toast(L("تعذر تنفيذ الإجراء","Action failed"))}else{MM.fol[r.author_id]=on?1:0;madaRLSave()}}
else if(a==="comment"){typeof madaComments==="function"&&madaComments(r.post_id)}
else if(a==="share"){try{if(navigator.share)await navigator.share({url:r.src});else{await navigator.clipboard.writeText(r.src);toast(L("تم نسخ الرابط","Link copied"))}}catch(e){}}
else if(a==="repost"){if(r.rp)return;const {error}=await madaSb.from("posts").insert({author_id:uid,body:r.src});if(error)toast(L("تعذرت إعادة النشر","Repost failed"));else{r.rp=1;madaRLPaint(s,r);toast(L("تمت إعادة النشر","Reposted"))}}}
function madaRLMount(w){madaRLStop();const R=madaRL;w.dataset.m=1;R.root=w;document.body.classList.add("in-reels");
w.innerHTML=`<div class="rtop"><button class="ib" data-go="home" aria-label="${L("رجوع","Back")}">${ic("back")}</button><button class="ib" data-ra="mute" aria-label="${L("الصوت","Sound")}"></button><button class="ib" data-ra="quality" style="display:none;width:auto;padding:0 12px;font-size:.8rem" aria-label="${L("جودة الفيديو","Video quality")}"></button></div><div class="rls-s"></div><div class="rcap" role="status">${L("جارٍ التحميل…","Loading…")}</div>`;R.sc=w.querySelector(".rls-s");madaRLMute();
R.io=new IntersectionObserver(es=>es.forEach(e=>{const s=e.target;if(e.isIntersecting&&e.intersectionRatio>=.7)madaRLAct(s);else{const v=s.querySelector("video");v&&!v.paused&&v.pause()}}),{root:R.sc,threshold:[0,.7]});
w.addEventListener("click",e=>{const b=e.target.closest("[data-ra]"),s=e.target.closest(".rl");if(b){const a=b.dataset.ra;if(a==="mute"){R.muted=!R.muted;snd(R.muted?"mute":"unmute");madaRLMute();const v=R.cur&&R.cur.querySelector("video");if(v)v.muted=R.muted}else if(a==="quality")madaQCycle();else if(s)madaRLAction(a,s);return}const cp=e.target.closest(".rl-cap");if(cp){cp.classList.toggle("open");return}if(!s||e.target.closest("button,a,.rl-info"))return;const R2=madaRL;R2.tp=(R2.tp||0)+1;clearTimeout(R2.tt);if(R2.tp>=3){R2.tp=0;madaRLHeart(s,e.clientX,e.clientY);return}R2.tt=setTimeout(()=>{const n=R2.tp;R2.tp=0;if(n!==1)return;const v=s.querySelector("video"),pp=s.querySelector(".rl-pp");if(v.paused)madaRLPlay(s,1);else v.pause();pp.innerHTML=`<svg viewBox="0 0 24 24"><path d="${v.paused?"M8 5v14l11-7z":"M6 5h4v14H6zm8 0h4v14h-4z"}"/></svg>`;pp.classList.remove("on");void pp.offsetWidth;pp.classList.add("on")},300)});
madaRLPage()}
document.addEventListener("visibilitychange",()=>{const R=madaRL;if(!R.cur)return;if(document.visibilityState==="visible")madaRLPlay(R.cur);else R.sc&&R.sc.querySelectorAll("video").forEach(v=>v.pause())});
{let q=0;new MutationObserver(()=>{if(q)return;q=requestAnimationFrame(()=>{q=0;if(madaRL.root&&!madaRL.root.isConnected)madaRLStop();const r=document.getElementById("madaRls");if(r&&!r.dataset.m)madaRLMount(r)})}).observe(document.body,{childList:true,subtree:true})}

/* ===== follow: + -> check -> disappears ===== */
function madaFolFx(b){b.disabled=true;b.classList.add("ok");snd("fol");try{navigator.vibrate&&navigator.vibrate([10,30,14])}catch(e){}
const r=b.getBoundingClientRect(),g=document.createElement("i");g.className="fol-ring";g.style.cssText="left:"+(r.left+r.width/2)+"px;top:"+(r.top+r.height/2)+"px";document.body.appendChild(g);setTimeout(()=>g.remove(),700);fx(b,"#4ff0a0");
b._ft=[setTimeout(()=>{document.querySelectorAll('.fol-plus[data-xf="'+b.dataset.xf+'"]').forEach(x=>{x.classList.add("gone");setTimeout(()=>x.remove(),480)})},850)]}
function madaFolUndo(b){(b._ft||[]).forEach(clearTimeout);b.disabled=false;b.classList.remove("ok","gone");toast(L("تعذرت المتابعة","Couldn't follow"))}

/* ===== long-press on comments: 3 quick reactions with effects ===== */
(()=>{const SEL='[data-cm],[data-xc],[data-ra="comment"]',FX={laugh:{e:"😂",n:16,an:"lpl",du:1.5,s:"r1",c:"255,200,60"},love:{e:"😍",n:14,an:"lpv",du:1.7,s:"r2",c:"255,80,140"},fire:{e:"🔥",n:18,an:"lpf",du:1.2,s:"r3",c:"255,120,40"}};
let t=0,sx=0,sy=0,sw=0,pk=null,pt=0;
async function save(b,em){try{const u=madaCurrentUser&&madaCurrentUser.id;
if(b.dataset.xc!==undefined){if(!u)return;const pid=b.dataset.xc,{error}=await madaSb.from("comments").insert({post_id:pid,author_id:u,body:em});if(error)throw error;MM.cm[pid]=(MM.cm[pid]||0)+1;madaRefreshPosts()}
else if(b.dataset.ra==="comment"){if(!u)return;const s=b.closest(".rl"),r=s&&madaRLIt(s);if(!r)return;const {error}=await madaSb.from("comments").insert({post_id:r.post_id,author_id:u,body:em});if(error)throw error;r.comment_count=(r.comment_count|0)+1;madaRLPaint(s,r);madaRLSave()}
else if(b.dataset.cm!==undefined){const k=b.dataset.cm;(S.cm[k]=S.cm[k]||[]).push(em);render()}}catch(e){toast(L("تعذر إضافة التعليق","Couldn't add the comment"))}}
const close=()=>{clearTimeout(pt);if(pk){pk.remove();pk=null}};
function burst(k,b){const f=FX[k],r=b.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;snd(f.s);try{navigator.vibrate&&navigator.vibrate(14)}catch(e){}
const g=document.createElement("i");g.className="lp-ring";g.style.cssText="left:"+cx+"px;top:"+cy+"px;--c:"+f.c;document.body.appendChild(g);setTimeout(()=>g.remove(),700);
for(let i=0;i<f.n;i++){const e=document.createElement("span");e.className="lp-fx";e.textContent=f.e;const sd=Math.random()-.5;e.style.cssText="left:"+cx+"px;top:"+cy+"px;--an:"+f.an+";--du:"+(f.du+Math.random()*.5)+"s;--dl:"+(i*.045)+"s;--dx:"+Math.round(sd*220)+"px;--dy:"+(-(160+Math.random()*190))+"px;--r:"+Math.round(sd*80)+"deg;--sz:"+(22+Math.round(Math.random()*18))+"px";document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}}
function open(b){sw=1;close();snd("pop");try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}const r=b.getBoundingClientRect(),d=document.createElement("div");d.className="lp-pk";d.setAttribute("role","menu");
d.innerHTML=Object.keys(FX).map(k=>'<button type="button" role="menuitem" data-lpe="'+k+'" aria-label="'+FX[k].e+'">'+FX[k].e+'</button>').join("");document.body.appendChild(d);
const w=d.offsetWidth;d.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))+"px";d.style.top=Math.max(8,r.top-d.offsetHeight-10)+"px";pk=d;
d.addEventListener("click",e=>{e.stopPropagation();const x=e.target.closest("[data-lpe]");if(!x)return;burst(x.dataset.lpe,x);save(b,FX[x.dataset.lpe].e);close()});pt=setTimeout(close,4500)}
document.addEventListener("pointerdown",e=>{if(pk&&!e.target.closest(".lp-pk"))close();const b=e.target.closest(SEL);if(!b)return;sx=e.clientX;sy=e.clientY;clearTimeout(t);t=setTimeout(()=>{t=0;open(b)},480)},{passive:true});
document.addEventListener("pointermove",e=>{if(t&&Math.hypot(e.clientX-sx,e.clientY-sy)>10){clearTimeout(t);t=0}},{passive:true});
["pointerup","pointercancel"].forEach(n=>document.addEventListener(n,()=>{clearTimeout(t);t=0;if(sw)setTimeout(()=>{sw=0},400)}));
addEventListener("click",e=>{if(sw&&e.target.closest(SEL)){e.stopPropagation();e.preventDefault();sw=0}},true);
document.addEventListener("contextmenu",e=>{if(e.target.closest(SEL))e.preventDefault()});
document.addEventListener("click",e=>{const b=e.target.closest("#nav button");b&&snd("tap")});
})();
